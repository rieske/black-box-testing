name: main
concurrency: main

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: 25.0.5+8.0.LTS
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build
      run: ./gradlew build

